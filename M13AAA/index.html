<!-- Design and code shared by every league: ../shared/ -->
<!-- C = version of the shared code: bump it whenever shared/hub.js or shared/hub.css change, so browsers fetch the new copy.
     D = data version: changes every 15 minutes, so scores are never more than 15 minutes old but repeat visits use the cached copy.
     Both scripts are preloaded here so they download together. -->
<script>var C = "20261119b", D = Math.floor(Date.now() / 900000);
document.write('<link rel="stylesheet" href="../shared/hub.css?v=' + C + '"><link rel="preload" as="script" href="data.js?v=' + D + '"><link rel="preload" as="script" href="../shared/hub.js?v=' + C + '">');</script>
<link rel="stylesheet" href="logos.css">
</head>
<body>
<!-- This league's files: league.js (settings), data.js (games, standings, rosters) -->
<script src="league.js"></script>
<script>document.write('<script src="data.js?v=' + D + '"><\/script>');</script>
<script src="../shared/logo.js"></script>
<script src="../shared/leagues.js"></script>
<script>document.write('<script src="../shared/hub.js?v=' + C + '"><\/script>');</script>
</body>
