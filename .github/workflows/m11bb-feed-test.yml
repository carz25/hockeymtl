name: M11BB feed test
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/m11bb-feed-test.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/m11bb/feed_test.py | tee -a "$GITHUB_STEP_SUMMARY"
